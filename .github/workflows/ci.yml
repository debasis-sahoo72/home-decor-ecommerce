name: Checks
on:
  push:
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run check:contrast
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: decor
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: decor_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U decor -d decor_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://decor:ci-only-password@127.0.0.1:5432/decor_test
      TEST_DATABASE_URL: postgresql+psycopg://decor:ci-only-password@127.0.0.1:5432/decor_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: python -m ruff check .
      - run: python -m pytest
      - run: python -m alembic upgrade head
      - run: python -m alembic check
      - name: Verify migration round trip on disposable database
        run: |
          python -m alembic downgrade base
          python -m alembic upgrade head
          python -m alembic check
      - name: Check real database readiness
        run: python -c "from fastapi.testclient import TestClient; from app.main import app; response = TestClient(app).get('/api/v1/ready'); assert response.status_code == 200, response.text"
